include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Keep compatibility with host apps using package:flutter/material.dart
    # on Flutter 3.47+ / 3.50+ until host apps migrate together.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - example/build/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    unawaited_futures: true
    prefer_const_constructors: true
    prefer_final_fields: true
