name: smart_review_feedback
description: Drop-in Flutter smart rating gate & feedback collector — sends 4-5 star users to Google Play / App Store In-App Review and 1-3 star users to an in-app feedback sheet with auto diagnostics (EN + বাংলা UI).
version: 0.1.0
homepage: https://github.com/Keshab1997/smart_review_feedback
repository: https://github.com/Keshab1997/smart_review_feedback
issue_tracker: https://github.com/Keshab1997/smart_review_feedback/issues
topics:
  - in-app-review
  - feedback
  - play-store
  - rating
  - flutter

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  in_app_review: ^2.0.9
  package_info_plus: '>=8.0.0 <11.0.0'
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
